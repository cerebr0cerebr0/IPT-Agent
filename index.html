<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IMPROTECH – Agent Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --p900:#160E40;--p800:#251560;--p700:#3A1F82;--p600:#5535A8;
      --p500:#7B5CC0;--p300:#B09EE0;--p200:#D4C9F5;--p100:#EDE9FA;--p50:#F5F3FF;
      --gold:#F0A500;--gold-d:#C78600;--gold-l:#FFD166;
      --white:#FFFFFF;--gray50:#F8F7FC;--gray100:#EDECF5;--gray200:#D8D6E8;
      --gray400:#8B87A8;--gray600:#5B5775;--text:#1A1037;--text2:#6B6880;
      --ok:#10B981;--ok-bg:#D1FAE5;--err:#EF4444;--err-bg:#FEE2E2;
      --warn:#F59E0B;--warn-bg:#FEF3C7;
      --r:12px;--r-sm:8px;--sh:0 2px 16px rgba(37,21,96,.10);--sh-lg:0 8px 40px rgba(37,21,96,.18)
    }
    body{font-family:'DM Sans',sans-serif;background:var(--gray50);color:var(--text);min-height:100vh}
    h1,h2,h3,h4{font-family:'Sora',sans-serif}
    .loader{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px}
    .spinner{width:36px;height:36px;border:3px solid var(--p100);border-top-color:var(--p600);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .login-page{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
    .login-brand{background:var(--p800);display:flex;flex-direction:column;justify-content:center;padding:60px;position:relative;overflow:hidden}
    .login-brand::before{content:'';position:absolute;top:-120px;right:-120px;width:440px;height:440px;background:var(--p700);border-radius:50%;opacity:.35}
    .login-brand::after{content:'';position:absolute;bottom:-100px;left:-80px;width:320px;height:320px;background:var(--p900);border-radius:50%}
    .brand-content{position:relative;z-index:1}
    .brand-badge{display:inline-block;background:rgba(240,165,0,.18);color:var(--gold);border:1px solid rgba(240,165,0,.3);padding:4px 14px;border-radius:20px;font-size:11px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;margin-bottom:24px}
    .brand-title{color:var(--white);font-size:38px;font-weight:700;line-height:1.15;margin-bottom:14px}
    .brand-sub{color:var(--p300);font-size:15px;line-height:1.7;max-width:340px}
    .brand-stats{display:flex;gap:36px;margin-top:52px}
    .stat-num{color:var(--gold);font-family:'Sora',sans-serif;font-size:30px;font-weight:700}
    .stat-lbl{color:var(--p300);font-size:12px;margin-top:3px}
    .login-form-wrap{display:flex;align-items:center;justify-content:center;padding:60px 40px;background:var(--white)}
    .login-card{width:100%;max-width:360px}
    .login-card h2{font-size:26px;font-weight:700;margin-bottom:6px}
    .login-card>p{color:var(--text2);font-size:14px;margin-bottom:28px}
    .fg{margin-bottom:18px}
    .fg label{display:block;font-size:12px;font-weight:500;margin-bottom:6px;color:var(--gray600);text-transform:uppercase;letter-spacing:.4px}
    .fg input,.fg select,.fg textarea{width:100%;padding:11px 14px;border:1.5px solid var(--gray200);border-radius:var(--r-sm);font-family:'DM Sans',sans-serif;font-size:14px;background:var(--white);color:var(--text);transition:border-color .2s;outline:none}
    .fg input:focus,.fg select:focus{border-color:var(--p500)}
    .fg input[readonly]{background:var(--p50);color:var(--p700);font-weight:600}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 20px;border-radius:var(--r-sm);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all .18s;white-space:nowrap}
    .btn-primary{background:var(--p600);color:var(--white)}
    .btn-primary:hover:not(:disabled){background:var(--p700);transform:translateY(-1px)}
    .btn-primary:disabled{opacity:.55;cursor:not-allowed}
    .btn-gold{background:var(--gold);color:var(--p900);font-weight:600}
    .btn-gold:hover{background:var(--gold-d);transform:translateY(-1px)}
    .btn-outline{background:transparent;border:1.5px solid var(--gray200);color:var(--text)}
    .btn-outline:hover{border-color:var(--p500);color:var(--p600)}
    .btn-danger{background:var(--err-bg);color:#b91c1c;border:1px solid rgba(239,68,68,.2)}
    .btn-danger:hover{background:var(--err);color:white}
    .btn-sm{padding:7px 13px;font-size:12px}
    .btn-full{width:100%}
    .btn-ghost{background:rgba(255,255,255,.12);color:var(--white);border:1px solid rgba(255,255,255,.2)}
    .btn-ghost:hover{background:rgba(255,255,255,.2)}
    .alert{padding:11px 16px;border-radius:var(--r-sm);font-size:13px;margin-bottom:16px;line-height:1.5}
    .alert-err{background:var(--err-bg);color:#991b1b;border-left:3px solid var(--err)}
    .alert-ok{background:var(--ok-bg);color:#065f46;border-left:3px solid var(--ok)}
    .alert-warn{background:var(--warn-bg);color:#92400e;border-left:3px solid var(--warn)}
    .alert-info{background:var(--p50);color:var(--p700);border-left:3px solid var(--p500)}
    .portal{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
    .sidebar{background:var(--p800);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
    .sb-brand{padding:22px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
    .sb-brand-name{color:var(--white);font-family:'Sora',sans-serif;font-size:15px;font-weight:700}
    .sb-brand-sub{color:var(--p300);font-size:11px;margin-top:2px}
    .sb-user{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px}
    .avatar{width:38px;height:38px;background:var(--p600);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-family:'Sora',sans-serif;font-size:15px;font-weight:700;flex-shrink:0}
    .user-name{color:var(--white);font-size:13px;font-weight:500}
    .user-role{color:var(--gold);font-size:11px;background:rgba(240,165,0,.15);display:inline-block;padding:2px 8px;border-radius:10px;margin-top:3px}
    .sb-nav{padding:14px 12px;flex:1}
    .nav-lbl{color:var(--p300);font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:6px 8px 4px}
    .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--p300);font-size:13px;cursor:pointer;transition:all .15s;user-select:none}
    .nav-item:hover{background:rgba(255,255,255,.08);color:var(--white)}
    .nav-item.active{background:var(--p600);color:var(--white)}
    .sb-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08)}
    .main{padding:32px;overflow-y:auto}
    .ph{margin-bottom:28px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .ph h1{font-size:24px;font-weight:700}
    .ph p{color:var(--text2);font-size:13.5px;margin-top:4px}
    .card{background:var(--white);border-radius:var(--r);box-shadow:var(--sh);padding:24px}
    .card-ttl{font-size:14px;font-weight:600;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
    .sc{background:var(--white);border-radius:var(--r);padding:20px;box-shadow:var(--sh);border-top:3px solid var(--p500)}
    .sc.gold{border-top-color:var(--gold)}.sc.green{border-top-color:var(--ok)}
    .sc.purple{border-top-color:var(--p700)}.sc.gray{border-top-color:var(--gray400)}
    .sv{font-family:'Sora',sans-serif;font-size:26px;font-weight:700}
    .sl{font-size:12px;color:var(--text2);margin-top:5px}
    .tw{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{text-align:left;padding:10px 14px;color:var(--text2);font-weight:500;font-size:11px;letter-spacing:.5px;text-transform:uppercase;border-bottom:1.5px solid var(--gray100);white-space:nowrap}
    td{padding:13px 14px;border-bottom:1px solid var(--gray100);vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tbody tr:hover td{background:var(--p50)}
    .td-name strong{display:block}.td-name span{color:var(--text2);font-size:12px}
    .bdg{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
    .bdg-pending{background:var(--warn-bg);color:#92400e}.bdg-confirmed{background:var(--ok-bg);color:#065f46}
    .bdg-cancelled{background:var(--err-bg);color:#b91c1c}.bdg-active{background:var(--ok-bg);color:#065f46}
    .bdg-suspended{background:var(--err-bg);color:#b91c1c}.bdg-paid{background:var(--ok-bg);color:#065f46}
    .bdg-due{background:var(--warn-bg);color:#92400e}.bdg-none{background:var(--gray100);color:var(--gray600)}
    .bdg-link{background:var(--p100);color:var(--p700)}.bdg-qr{background:var(--p100);color:var(--p700)}
    .bdg-direct{background:var(--gray100);color:var(--gray600)}
    .overlay{position:fixed;inset:0;background:rgba(22,14,64,.65);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
    .modal{background:var(--white);border-radius:var(--r);box-shadow:var(--sh-lg);padding:28px;width:100%;max-width:500px;max-height:92vh;overflow-y:auto}
    .modal-ttl{font-size:18px;font-weight:700;margin-bottom:22px;display:flex;align-items:center;justify-content:space-between}
    .modal-x{cursor:pointer;color:var(--text2);font-size:20px;line-height:1;padding:4px}
    .code-box{background:var(--p50);border:1.5px solid var(--p100);border-radius:var(--r-sm);padding:12px 16px;font-family:monospace;font-size:13px;color:var(--p700);word-break:break-all;margin:10px 0;line-height:1.5}
    .enroll-page{min-height:100vh;background:linear-gradient(150deg,var(--p800) 0%,var(--p900) 100%);display:flex;align-items:flex-start;justify-content:center;padding:48px 20px}
    .enroll-card{background:var(--white);border-radius:20px;box-shadow:var(--sh-lg);width:100%;max-width:560px;overflow:hidden}
    .enroll-hdr{background:var(--p700);padding:28px 32px;position:relative;overflow:hidden}
    .enroll-hdr::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:rgba(255,255,255,.05);border-radius:50%}
    .enroll-hdr-badge{background:rgba(240,165,0,.2);color:var(--gold-l);border:1px solid rgba(240,165,0,.3);display:inline-block;padding:3px 12px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;position:relative}
    .enroll-hdr h1{color:var(--white);font-size:22px;font-weight:700;position:relative}
    .enroll-hdr p{color:var(--p200);font-size:13px;margin-top:6px;position:relative}
    .enroll-body{padding:32px}
    .agent-notice{background:var(--ok-bg);border:1px solid rgba(16,185,129,.25);border-radius:var(--r-sm);padding:10px 14px;font-size:13px;color:#065f46;margin-bottom:22px}
    .link-section{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    #qr-wrap canvas,#qr-wrap img{border-radius:8px;border:4px solid var(--p50)}
    .empty{text-align:center;padding:52px 24px;color:var(--text2)}
    .empty-ico{font-size:44px;margin-bottom:14px}
    .empty p{font-size:14px;line-height:1.6}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    hr{border:none;border-top:1px solid var(--gray100);margin:20px 0}
    .mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}
    .mb16{margin-bottom:16px}.mb24{margin-bottom:24px}
    .muted{color:var(--text2)}.sm{font-size:13px}.xs{font-size:11px}
    code{background:var(--p50);padding:2px 7px;border-radius:4px;font-size:12px;color:var(--p700);font-family:monospace}
    .fade{animation:fadeIn .25s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .portal{display:grid;grid-template-columns:248px 1fr;min-height:100vh}.sidebar{width:248px}.main{min-width:0}
    @media(max-width:780px){
      .login-brand{display:none}.login-page{grid-template-columns:1fr}
      .portal{grid-template-columns:1fr}.sidebar{display:none}
      .main{padding:20px}.g2,.link-section{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<div id="app"><div class="loader"><div class="spinner"></div></div></div>

<script>
// ══════════════════════════════════════
//  FIREBASE CONFIG
// ══════════════════════════════════════
var FB_CONFIG = {
  apiKey:"AIzaSyDaF6KaZN2vdFxR6-myx46XD26Hstkpwk0",
  authDomain:"ipt-agent.firebaseapp.com",
  projectId:"ipt-agent",
  storageBucket:"ipt-agent.firebasestorage.app",
  messagingSenderId:"758605257056",
  appId:"1:758605257056:web:ac2680e273525784e82605"
};

if(typeof firebase==='undefined'){
  document.getElementById('app').innerHTML='<div class="loader"><p style="color:#EF4444;font-size:14px;text-align:center;padding:20px">Error: Firebase did not load.<br>Check your internet connection and refresh.</p></div>';
  throw new Error('Firebase SDK not loaded');
}

firebase.initializeApp(FB_CONFIG);
var auth=firebase.auth();
var db=firebase.firestore();

// ══════════════════════════════════════
//  PROGRAMMES
// ══════════════════════════════════════
var PROGRAMS=[
  {id:'ccna',name:'Cisco CCNA'},{id:'ccnp-ent',name:'Cisco CCNP Enterprise'},
  {id:'ccnp-sec',name:'Cisco CCNP Security'},{id:'ccie-ent',name:'Cisco CCIE Enterprise'},
  {id:'ccie-sec',name:'Cisco CCIE Security'},{id:'sec-plus',name:'CompTIA Security+'},
  {id:'cysa',name:'CompTIA CySA+'},{id:'a-plus',name:'CompTIA A+'},
  {id:'az900',name:'Microsoft Azure AZ-900'},{id:'az104',name:'Microsoft Azure AZ-104'},
  {id:'nse4',name:'Fortinet NSE 4'},{id:'nse7',name:'Fortinet NSE 7'},
  {id:'itil',name:'ITIL Foundation'},{id:'pmp',name:'PMP Certification'},
];

// ══════════════════════════════════════
//  STATE & HELPERS
// ══════════════════════════════════════
var S={user:null,agent:null,isAdmin:false,tab:'enrollments'};
function $(id){return document.getElementById(id);}
function el(){return $('app');}
function genCode(){var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r='AGT-';for(var i=0;i<4;i++)r+=c[Math.floor(Math.random()*c.length)];return r;}
function enrollUrl(code){return location.origin+location.pathname+'?ref='+code;}
function fmt(ts){if(!ts)return'—';var d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});}
function progName(id){var p=PROGRAMS.find(function(x){return x.id===id;});return p?p.name:id;}
function initials(n){return(n||'?').split(' ').map(function(w){return w[0];}).slice(0,2).join('').toUpperCase();}
var BC={pending:'bdg-pending',confirmed:'bdg-confirmed',cancelled:'bdg-cancelled',active:'bdg-active',suspended:'bdg-suspended',paid:'bdg-paid',due:'bdg-due',none:'bdg-none',link:'bdg-link',qr:'bdg-qr',direct:'bdg-direct'};
var BL={pending:'Pending',confirmed:'Confirmed',cancelled:'Cancelled',active:'Active',suspended:'Suspended',paid:'Paid',due:'Due',none:'—',link:'Link',qr:'QR Code',direct:'Direct'};
function bdg(s){return'<span class="bdg '+(BC[s]||'bdg-none')+'">'+(BL[s]||s)+'</span>';}

// ══════════════════════════════════════
//  FIRESTORE
// ══════════════════════════════════════
function getAgents(){return db.collection('agents').get().then(function(s){return s.docs.map(function(d){return Object.assign({id:d.id},d.data());});});}
function getAgentByCode(code){return db.collection('agents').where('code','==',code).limit(1).get().then(function(s){return s.empty?null:Object.assign({id:s.docs[0].id},s.docs[0].data());});}
function getEnrollments(agentId){
  return db.collection('enrollments').orderBy('timestamp','desc').get().then(function(s){
    var all=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    if(!agentId)return all;
    return all.filter(function(e){
      return e.agentId===agentId || (S.agent && e.agentCode===S.agent.code);
    });
  });
}
function updateEnrollment(id,u){return db.collection('enrollments').doc(id).update(u);}
function updateAgentStatus(id,s){return db.collection('agents').doc(id).update({status:s});}
function markCommPaid(eid,aid,amt){return db.collection('enrollments').doc(eid).update({commissionStatus:'paid'}).then(function(){if(aid&&amt>0)return db.collection('agents').doc(aid).update({totalCommission:firebase.firestore.FieldValue.increment(amt)});});}

function submitEnrollment(data){
  return db.collection('enrollments').where('studentEmail','==',data.studentEmail).limit(1).get().then(function(dup){
    if(!dup.empty)throw new Error('A record with this email already exists.');
    return db.collection('enrollments').add(Object.assign({},data,{status:'pending',commissionStatus:data.agentId?'due':'none',timestamp:firebase.firestore.FieldValue.serverTimestamp()}));
  }).then(function(ref){
    if(data.agentId)db.collection('agents').doc(data.agentId).update({totalEnrollments:firebase.firestore.FieldValue.increment(1)});
    return ref.id;
  });
}

function createAgentUser(email,pwd){
  return fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+FB_CONFIG.apiKey,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pwd,returnSecureToken:true})}).then(function(r){return r.json();}).then(function(d){if(d.error)throw new Error(d.error.message);return d.localId;});
}
function createAgent(data){
  return createAgentUser(data.email,data.pwd).then(function(uid){
    return db.collection('agents').doc(uid).set({name:data.name,email:data.email,phone:data.phone||'',code:data.code,role:'agent',status:'active',commissionAmount:Number(data.commission)||0,totalEnrollments:0,totalCommission:0,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  });
}

// ══════════════════════════════════════
//  LOGIN
// ══════════════════════════════════════
function doLogin(){
  var btn=$('lb'),ale=$('la');
  var email=($('le')?$('le').value:'').trim();
  var pwd=$('lp')?$('lp').value:'';
  if(!email||!pwd){ale.innerHTML='<div class="alert alert-err">Enter your email and password.</div>';return;}
  btn.disabled=true;btn.textContent='Login…';ale.innerHTML='';
  auth.signInWithEmailAndPassword(email,pwd).catch(function(err){
    console.error(err.code,err.message);
    var m={'auth/wrong-password':'Password incorrect.','auth/user-not-found':'Email not found.','auth/invalid-email':'Invalid email.','auth/invalid-credential':'Incorrect email or password.','auth/too-many-requests':'Too many attempts.','auth/network-request-failed':'Network error.','auth/operation-not-allowed':'Email/Password is not enabled in Firebase.'};
    ale.innerHTML='<div class="alert alert-err">'+(m[err.code]||'('+err.code+') '+err.message)+'</div>';
    btn.disabled=false;btn.textContent='Sign in';
  });
}

function viewLogin(errMsg){
  el().innerHTML=
  '<div class="login-page">'+
    '<div class="login-brand"><div class="brand-content">'+
      '<div class="brand-badge">Agent Portal</div>'+
      '<h1 class="brand-title">Track your<br>referrals</h1>'+
      '<p class="brand-sub">Manage enrollments, track commissions and generate your personal referral link.</p>'+
      '<div class="brand-stats"><div><div class="stat-num">600+</div><div class="stat-lbl">Certified pros</div></div><div><div class="stat-num">14</div><div class="stat-lbl">Certifications</div></div><div><div class="stat-num">4</div><div class="stat-lbl">Countries</div></div></div>'+
    '</div></div>'+
    '<div class="login-form-wrap"><div class="login-card fade">'+
      '<h2>Login</h2><p>Access your agent or admin space</p>'+
      '<div id="la">'+(errMsg?'<div class="alert alert-err">'+errMsg+'</div>':'')+'</div>'+
      '<div class="fg"><label>Email</label><input type="email" id="le" placeholder="vous@email.com" autocomplete="email"></div>'+
      '<div class="fg"><label>Password</label><input type="password" id="lp" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')doLogin()"></div>'+
      '<button type="button" class="btn btn-primary btn-full" id="lb" onclick="doLogin()">Sign in</button>'+
    '</div></div>'+
  '</div>';
}

// ══════════════════════════════════════
//  ENROLLMENT FORM
// ══════════════════════════════════════
var _agent=null,_src='link';
function viewEnroll(refCode){
  el().innerHTML='<div class="loader"><div class="spinner"></div></div>';
  var p=refCode?getAgentByCode(refCode):Promise.resolve(null);
  p.then(function(agent){
    _agent=agent;_src=location.search.includes('qr=1')?'qr':'link';
    el().innerHTML=
    '<div class="enroll-page"><div class="enroll-card fade">'+

function submitForm(){
  var btn=$('eb'),ale=$('ea');
  var name=($('en')?$('en').value:'').trim();
  var email=($('ee')?$('ee').value:'').trim().toLowerCase();
  var phone=($('ep')?$('ep').value:'').trim();
  var pid=$('epr')?$('epr').value:'';
  if(!name||!email||!phone||!pid){ale.innerHTML='<div class="alert alert-err">Please fill in all required fields (*).</div>';return;}
  btn.disabled=true;btn.textContent='Sending…';ale.innerHTML='';
  submitEnrollment({studentName:name,studentEmail:email,studentPhone:phone,studentCity:($('ec')?$('ec').value:'').trim(),studentMessage:($('em')?$('em').value:'').trim(),programId:pid,programName:progName(pid),agentId:_agent?_agent.id:null,agentCode:_agent?_agent.code:null,agentName:_agent?_agent.name:null,source:_agent?_src:'direct'})
  .then(function(){
    el().innerHTML='<div class="enroll-page"><div class="enroll-card fade" style="text-align:center"><div class="enroll-hdr"><div class="enroll-hdr-badge">IMPROTECH Training Center</div><h1>Application received ✓</h1></div><div class="enroll-body"><div style="font-size:56px;margin-bottom:18px">🎉</div><h2 style="font-size:20px;margin-bottom:10px">Thank you, '+name.split(' ')[0]+' !</h2><p class="muted" style="font-size:14px;line-height:1.8">Your request for <strong>'+progName(pid)+'</strong><br>has been received. An advisor will contact you within 24–48h.</p><div style="margin-top:28px;padding:16px;background:var(--p50);border-radius:12px"><p class="xs muted">Direct contact:</p><p class="sm" style="color:var(--p700);font-weight:500;margin-top:4px">info@improtech.edu.gh · 0266134658</p></div></div></div></div>';
  }).catch(function(err){ale.innerHTML='<div class="alert alert-err">'+err.message+'</div>';btn.disabled=false;btn.textContent='Submit my application →';});
}

function viewAdmin(){
  el().innerHTML=
  '<div class="portal"><div class="sidebar">'+
    '<div class="sb-brand"><div class="sb-brand-name">IMPROTECH</div><div class="sb-brand-sub">Administration</div></div>'+
    '<div class="sb-user"><div class="avatar">'+initials(S.agent&&S.agent.name)+'</div><div><div class="user-name">'+(S.agent&&S.agent.name||'Admin')+'</div><div class="user-role">Admin</div></div></div>'+
    '<div class="sb-nav"><div class="nav-lbl">Navigation</div>'+
      ['enrollments','agents','commissions'].map(function(k){var lbl={enrollments:'📋 Enrollments',agents:'👥 Agents',commissions:'💰 Commissions'}[k];return'<div class="nav-item'+(S.tab===k?' active':'')+'" onclick="goTab(\''+k+'\')">'+lbl+'</div>';}).join('')+

function goTab(t){
  S.tab=t;
  document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active');});
  var lbl={enrollments:'📋 Enrollments',agents:'👥 Agents',commissions:'💰 Commissions',dashboard:'📊 Dashboard',link:'🔗 My Link',students:'🎓 My Students'}[t];
  document.querySelectorAll('.nav-item').forEach(function(n){if(n.textContent.trim()===lbl)n.classList.add('active');});
  loadTab();
}

function loadTab(){if(S.isAdmin)loadAdminTab();else loadAgentTab();}

function loadAdminTab(){
  var area=$('main');
  area.innerHTML='<div class="loader" style="min-height:60vh"><div class="spinner"></div></div>';

  if(S.tab==='enrollments'){
    getEnrollments().then(function(rows){
      var t=rows.length,p=rows.filter(function(e){return e.status==='pending';}).length,c=rows.filter(function(e){return e.status==='confirmed';}).length,v=rows.filter(function(e){return e.agentId;}).length;
      area.innerHTML='<div class="fade"><div class="ph"><div><h1>Enrollments</h1><p>All received applications</p></div></div>'+
        '<div class="stats mb24"><div class="sc purple"><div class="sv">'+t+'</div><div class="sl">Total</div></div><div class="sc gray"><div class="sv">'+p+'</div><div class="sl">Pending</div></div><div class="sc green"><div class="sv">'+c+'</div><div class="sl">Confirmed</div></div><div class="sc gold"><div class="sv">'+v+'</div><div class="sl">Via agent</div></div></div>'+
        '<div class="card"><div class="card-ttl">Enrollment list</div><div class="tw">'+
        (rows.length===0?'<div class="empty"><div class="empty-ico">📭</div><p>No enrollments yet.</p></div>':
          '<table><thead><tr><th>Student</th><th>Program</th><th>Agent</th><th>Source</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+
          rows.map(function(e){return'<tr><td class="td-name"><strong>'+e.studentName+'</strong><span>'+e.studentEmail+'</span></td><td>'+(e.programName||e.programId||'')+'</td><td>'+(e.agentName||'<span class="muted">—</span>')+'</td><td>'+bdg(e.source||'direct')+'</td><td>'+fmt(e.timestamp)+'</td><td>'+bdg(e.status)+'</td><td><div class="row">'+(e.status==='pending'?'<button class="btn btn-primary btn-sm" onclick="confE(\''+e.id+'\')">✓</button>':'')+(e.status!=='cancelled'?'<button class="btn btn-danger btn-sm" onclick="cancE(\''+e.id+'\')">✕</button>':'')+'</div></td></tr>';}).join('')+
          '</tbody></table>')+
        '</div></div></div>';
    });
  } else if(S.tab==='agents'){
    getAgents().then(function(agents){
      var agts=agents.filter(function(a){return a.role==='agent';});
      area.innerHTML='<div class="fade"><div class="ph"><div><h1>Agents</h1><p>'+agts.filter(function(a){return a.status==='active';}).length+' active</p></div><button class="btn btn-primary" onclick="showNewAgent()">+ New agent</button></div>'+
        '<div class="card"><div class="tw">'+
        (agts.length===0?'<div class="empty"><div class="empty-ico">👥</div><p>No agents yet. Create one above.</p></div>':
          '<table><thead><tr><th>Name</th><th>Code</th><th>Email</th><th>Enrollments</th><th>Commission</th><th>Status</th><th>Actions</th></tr></thead><tbody>'+
          agts.map(function(a){return'<tr><td><strong>'+a.name+'</strong></td><td><code>'+a.code+'</code></td><td class="sm">'+a.email+'</td><td>'+(a.totalEnrollments||0)+'</td><td>GHS '+(a.totalCommission||0).toLocaleString()+'</td><td>'+bdg(a.status)+'</td><td><div class="row"><button class="btn btn-sm btn-outline" onclick="cpLink(\''+a.code+'\',this)">🔗 Link</button>'+(a.status==='active'?'<button class="btn btn-sm btn-danger" onclick="togAgent(\''+a.id+'\',\'suspended\')">Suspend</button>':'<button class="btn btn-sm btn-primary" onclick="togAgent(\''+a.id+'\',\'active\')">Reactivate</button>')+'</div></td></tr>';}).join('')+
          '</tbody></table>')+
        '</div></div></div>';
    });
  } else if(S.tab==='commissions'){
    Promise.all([getEnrollments(),getAgents()]).then(function(res){
      var rows=res[0],agents=res[1],amap={};
      agents.forEach(function(a){amap[a.id]=a;});
      var due=rows.filter(function(e){return e.commissionStatus==='due'&&e.status==='confirmed';});
      var paid=rows.filter(function(e){return e.commissionStatus==='paid';});
      area.innerHTML='<div class="fade"><div class="ph"><div><h1>Commissions</h1></div></div>'+
        '<div class="stats mb24"><div class="sc"><div class="sv">'+due.length+'</div><div class="sl">Due</div></div><div class="sc green"><div class="sv">'+paid.length+'</div><div class="sl">Paid</div></div></div>'+
        '<div class="card"><div class="card-ttl">To pay</div><div class="tw">'+
        (due.length===0?'<div class="empty"><div class="empty-ico">✅</div><p>All commissions are up to date.</p></div>':
          '<table><thead><tr><th>Agent</th><th>Student</th><th>Program</th><th>Date</th><th>Amount</th><th>Action</th></tr></thead><tbody>'+
          due.map(function(e){var a=amap[e.agentId],amt=a?a.commissionAmount||0:0;return'<tr><td><strong>'+(e.agentName||'—')+'</strong></td><td>'+e.studentName+'</td><td>'+(e.programName||'')+'</td><td>'+fmt(e.timestamp)+'</td><td>GHS '+amt+'</td><td><button class="btn btn-sm btn-primary" onclick="payC(\''+e.id+'\',\''+e.agentId+'\','+amt+',this)">Mark as paid</button></td></tr>';}).join('')+
          '</tbody></table>')+
        '</div></div></div>';
    });
  }
}

function confE(id){updateEnrollment(id,{status:'confirmed'}).then(function(){loadAdminTab();});}
function cancE(id){if(confirm('Cancel?'))updateEnrollment(id,{status:'cancelled',commissionStatus:'none'}).then(function(){loadAdminTab();});}
function togAgent(id,s){updateAgentStatus(id,s).then(function(){loadAdminTab();});}
function cpLink(code,btn){navigator.clipboard.writeText(enrollUrl(code));var t=btn.textContent;btn.textContent='✓ Copied';setTimeout(function(){btn.textContent=t;},2000);}
function payC(eid,aid,amt,btn){if(!confirm('Confirm payment?'))return;btn.disabled=true;markCommPaid(eid,aid,amt).then(function(){loadAdminTab();});}

function showNewAgent(){
  var code=genCode();
  var pwd=Math.random().toString(36).slice(-6).toUpperCase()+Math.floor(Math.random()*9000+1000);
  var ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML='<div class="modal fade"><div class="modal-ttl">Create an agent <span class="modal-x" onclick="this.closest(\'.overlay\').remove()">✕</span></div><div id="ma"></div>'+
    '<div class="fg"><label>Name *</label><input id="mn" placeholder="Prénom Name"></div>'+
    '<div class="g2"><div class="fg"><label>Email *</label><input type="email" id="me" placeholder="agent@email.com"></div><div class="fg"><label>Phone</label><input id="mph" placeholder="+233…"></div></div>'+
    '<div class="g2"><div class="fg"><label>Commission (GHS)</label><input type="number" id="mc" value="0"></div><div class="fg"><label>Agent code</label><input id="mco" value="'+code+'" readonly></div></div>'+
    '<div style="background:var(--p50);border-radius:8px;padding:14px;margin-bottom:16px">'+
      '<p class="xs muted">Password temporaire :</p><p style="font-family:monospace;font-size:16px;font-weight:700;color:var(--p700);margin-top:6px">'+pwd+'</p>'+
      '<p class="xs muted mt8">Referral link:</p><p class="xs" style="color:var(--p600);word-break:break-all;margin-top:4px">'+enrollUrl(code)+'</p>'+
    '</div>'+
    '<div class="row" style="justify-content:flex-end"><button class="btn btn-outline" onclick="this.closest(\'.overlay\').remove()">Cancel</button><button class="btn btn-primary" id="msb" onclick="saveAgent(\''+pwd+'\')">Create</button></div>'+
  '</div>';
  document.body.appendChild(ov);
}

function saveAgent(pwd){
  var btn=$('msb'),ma=$('ma');
  var name=($('mn')?$('mn').value:'').trim(),email=($('me')?$('me').value:'').trim().toLowerCase();
  if(!name||!email){ma.innerHTML='<div class="alert alert-err">Name et email requis.</div>';return;}
  btn.disabled=true;btn.textContent='Creating…';
  createAgent({name:name,email:email,phone:$('mph')?$('mph').value:'',pwd:pwd,code:$('mco')?$('mco').value:'',commission:$('mc')?$('mc').value:0})
  .then(function(){document.querySelector('.overlay').remove();loadAdminTab();})
  .catch(function(err){ma.innerHTML='<div class="alert alert-err">'+err.message+'</div>';btn.disabled=false;btn.textContent='Create';});
}

    });

    setTimeout(function(){var w=$('qr-wrap');if(w&&typeof QRCode!=='undefined')new QRCode(w,{text:urlQR,width:180,height:180,colorDark:'#251560',colorLight:'#ffffff'});},200);

function cpLnk(btn){navigator.clipboard.writeText(enrollUrl(S.agent.code));btn.textContent='✓ Copied!';setTimeout(function(){btn.textContent='Copy';},2000);}
function cpLinkT(url,btn){navigator.clipboard.writeText(url);var t=btn.textContent;btn.textContent='✓ Copied!';setTimeout(function(){btn.textContent=t;},2000);}
function dlQR(code){var c=document.querySelector('#qr-wrap canvas');if(c){var a=document.createElement('a');a.download='QR_'+code+'.png';a.href=c.toDataURL();a.click();}}

// ══════════════════════════════════════
//  ROUTER
// ══════════════════════════════════════
function route(user){
  if(!user){S={user:null,agent:null,isAdmin:false,tab:'enrollments'};viewLogin();return;}
  S.user=user;
  db.collection('agents').doc(user.uid).get().then(function(doc){
    if(!doc.exists){auth.signOut();return;}
    S.agent=Object.assign({id:doc.id},doc.data());
    S.isAdmin=S.agent.role==='admin';
    S.tab=S.isAdmin?'enrollments':'dashboard';
    if(S.isAdmin)viewAdmin();else viewAgent();
  }).catch(function(err){console.error(err);viewLogin('Error: '+err.message);});
}

if(initRef){

  auth.onAuthStateChanged(function(user){clearTimeout(t);route(user);});
