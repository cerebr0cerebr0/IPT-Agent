function getEnrollments(refId){
  return db.collection('enrollments').orderBy('timestamp','desc').get().then(function(s){
    var all=s.docs.map(function(d){return normalizeEnrollment(Object.assign({id:d.id},d.data()));});
    if(!refId)return all;
    return all.filter(function(e){
      return e.sourceId===refId || e.refId===refId || e.agentId===refId || 
             (S.profile && (e.sourceCode===S.profile.code || e.refCode===S.profile.code || e.agentCode===S.profile.code));
    });
  });
}

function normalizeEnrollment(e){
  e.leadStatus=e.leadStatus || (e.status==='confirmed'?'enrolled':(e.status==='cancelled'?'lost':'new'));
  e.sourceType=e.sourceType || e.refType || (e.agentId?'agent':'direct');
  e.sourceId=e.sourceId || e.refId || e.agentId || null;
  e.sourceCode=e.sourceCode || e.refCode || e.agentCode || null;
  e.sourceName=e.sourceName || e.refName || e.agentName || null;
  e.agentId=e.agentId || e.sourceId || e.refId || null;
  e.agentCode=e.agentCode || e.sourceCode || e.refCode || null;
  e.agentName=e.agentName || e.sourceName || e.refName || null;
  e.programName=e.programName || progName(e.programId);
  e.commissionStatus=e.commissionStatus || (e.sourceId?'due':'none');
  e.commissionAmount=Number(e.commissionAmount || 0);
  return e;
}

    {key:'analytics',label:'Analytics',icon:'📈'},{key:'leads',label:'Leads Pipeline',icon:'🎯'},{key:'partners',label:'Partners & Schools',icon:'🤝'},

function adminDashboard(area){Promise.all([getEnrollments(),getProfiles()]).then(function(res){var rows=res[0],partners=res[1].filter(function(p){return p.role!=='admin'}),paid=rows.filter(function(e){return e.leadStatus==='paid'}).length,active=partners.filter(function(p){return p.status==='active'}).length,due=rows.filter(function(e){return e.commissionStatus==='due'}).reduce(function(a,e){return a+Number(e.commissionAmount||0)},0);area.innerHTML='<div class="ph"><div><h1>Dashboard</h1><p>Overview of leads, partners, conversions and commissions.</p></div><button class="btn btn-primary" onclick="S.tab=\'leads\';viewAdmin()">View pipeline</button></div><div class="stats"><div class="sc"><div class="sv">'+rows.length+'</div><div class="sl">Total leads</div></div><div class="sc green"><div class="sv">'+paid+'</div><div class="sl">Paid students</div></div><div class="sc blue"><div class="sv">'+active+'</div><div class="sl">Active partners</div></div><div class="sc gold"><div class="sv">'+money(due)+'</div><div class="sl">Commission due</div></div></div><div class="card"><div class="card-ttl">Lead stages</div><div class="tw"><table><thead><tr><th>Stage</th><th>Count</th><th>Share</th></tr></thead><tbody>'+LEAD_STAGES.map(function(st){var c=rows.filter(function(e){return e.leadStatus===st}).length;return'<tr><td>'+badge(st)+'</td><td><strong>'+c+'</strong></td><td>'+Math.round((c/(rows.length||1))*100)+'%</td></tr>'}).join('')+'</tbody></table></div></div>'})}
function adminLeads(area){
  area.innerHTML =
    '<div class="ph"><div><h1>Leads Pipeline</h1><p>Manage follow-ups, assignment, WhatsApp follow-up and conversions.</p></div></div>'+
    '<div class="card"><div class="loader" style="min-height:140px"><div class="spinner"></div><p>Loading leads…</p></div></div>';

  getEnrollments().then(function(rows){
    rows = rows || [];
    window._allLeads = rows;
    var filtered = filterLeads(rows);
    window._filteredLeads = filtered;

    area.innerHTML =
      '<div class="ph"><div><h1>Leads Pipeline</h1><p>Manage follow-ups, assignment, WhatsApp follow-up and conversions.</p></div>'+
      '<div class="row"><button class="btn btn-outline btn-sm" onclick="exportExcel(window._filteredLeads||[],\'leads\')">⬇ Excel</button><button class="btn btn-outline btn-sm" onclick="exportPDF(window._filteredLeads||[],\'Leads Pipeline\',\'leads\')">⬇ PDF</button></div></div>'+
      renderLeadFilters(rows)+
      '<div class="stats"><div class="sc"><div class="sv">'+filtered.length+'</div><div class="sl">Filtered leads</div></div><div class="sc green"><div class="sv">'+filtered.filter(function(e){return e.leadStatus==='paid'}).length+'</div><div class="sl">Paid</div></div><div class="sc blue"><div class="sv">'+filtered.filter(function(e){return e.sourceType!=='direct'}).length+'</div><div class="sl">Via partners</div></div><div class="sc gold"><div class="sv">'+filtered.filter(function(e){return e.nextFollowUpDate}).length+'</div><div class="sl">Follow-ups set</div></div></div>'+
      leadTable(filtered,true);
  }).catch(function(err){
    showModuleError(area,'Leads Pipeline',err);

function conversionRate(part,total){
  if(!total) return '0%';
  return Math.round((Number(part||0)/Number(total||1))*100) + '%';
}

function analyticsBy(rows,keyFn){
  var map={};
  (rows||[]).forEach(function(e){
    var k=keyFn(e) || 'Unknown';
    if(!map[k]) map[k]={name:k,total:0,paid:0,enrolled:0,lost:0,revenue:0};
    map[k].total++;
    if(e.leadStatus==='paid'){
      map[k].paid++;
      map[k].revenue += Number(e.amountPaid || e.paymentAmount || 0);
    }
    if(e.leadStatus==='enrolled' || e.leadStatus==='paid' || e.status==='confirmed'){
      map[k].enrolled++;
    }
    if(e.leadStatus==='lost' || e.status==='cancelled'){
      map[k].lost++;
    }
  });
  return Object.values(map).sort(function(a,b){return b.total-a.total;});
}

function sumCommission(rows,status){
  return (rows||[]).filter(function(e){return !status || e.commissionStatus===status;})
    .reduce(function(a,e){return a + Number(e.commissionAmount || 0);},0);
}

  });
}

function openClassModal(){
  var ov=document.createElement('div');
  ov.className='overlay';
  ov.innerHTML='<div class="modal"><div class="modal-ttl">Create class <span class="modal-x" onclick="this.closest(\'.overlay\').remove()">✕</span></div><div id="ca"></div>'+
  '<div class="g2"><div class="fg"><label>Class name</label><input id="cname" placeholder="CCNA Weekend Batch 01"></div><div class="fg"><label>Program</label><select id="cprogram"><option value="">— Select —</option>'+PROGRAMS.map(function(p){return '<option value="'+p.id+'">'+p.name+'</option>';}).join('')+'</select></div></div>'+
  '<div class="g2"><div class="fg"><label>Start date</label><input id="cstart" type="date"></div><div class="fg"><label>Schedule</label><input id="cschedule" placeholder="Saturday 9am - 1pm"></div></div>'+
  '<div class="fg"><label>Trainer</label><input id="ctrainer" placeholder="Trainer name"></div>'+
  '<div class="row" style="justify-content:flex-end"><button class="btn btn-outline" onclick="this.closest(\'.overlay\').remove()">Cancel</button><button id="csave" class="btn btn-primary" onclick="saveClass()">Create class</button></div></div>';
  document.body.appendChild(ov);
}

function saveClass(){
  var name=$('cname').value.trim(),pid=$('cprogram').value,box=$('ca'),btn=$('csave');
  if(!name||!pid){box.innerHTML='<div class="alert alert-err">Class name and program are required.</div>';return}
  btn.disabled=true;btn.textContent='Creating…';
  createClass({name:name,programId:pid,programName:progName(pid),startDate:$('cstart').value,schedule:$('cschedule').value,trainer:$('ctrainer').value,status:'active'})
  .then(function(){document.querySelector('.overlay').remove();adminClasses($('main'));})
  .catch(function(err){box.innerHTML='<div class="alert alert-err">'+err.message+'</div>';btn.disabled=false;btn.textContent='Create class';});
}

function adminContracts(area){
  area.innerHTML =
    '<div class="ph"><div><h1>Contracts</h1><p>Track school/partner agreements, expiry and renewal alerts.</p></div><button class="btn btn-primary" onclick="openContractModal()">+ New contract</button></div>'+
    '<div class="card"><div class="loader" style="min-height:140px"><div class="spinner"></div><p>Loading contracts…</p></div></div>';

  Promise.all([getPartnerContracts(),getProfiles()]).then(function(res){
    var contracts = res[0] || [];
    var profiles = (res[1] || []).filter(function(p){return p.role!=='admin' && p.role!=='sales'});
    window._contractPartners = profiles;

    area.innerHTML =
      '<div class="ph"><div><h1>Contracts</h1><p>Track school/partner agreements, expiry and renewal alerts.</p></div><button class="btn btn-primary" onclick="openContractModal()">+ New contract</button></div>'+
      '<div class="card"><div class="tw">'+
      (contracts.length?'<table><thead><tr><th>Partner</th><th>Type</th><th>Start</th><th>End</th><th>Status</th><th>Document</th><th>Notes</th><th>Actions</th></tr></thead><tbody>'+
      contracts.map(function(c){return '<tr><td><strong>'+(c.partnerName||'')+'</strong></td><td>'+badge(c.partnerType||'school')+'</td><td>'+(c.startDate||'—')+'</td><td>'+(c.endDate||'—')+'</td><td>'+badge(c.status||'active')+'</td><td>'+(c.documentUrl?'<a target="_blank" href="'+c.documentUrl+'">Open</a>':'—')+'</td><td>'+(c.notes||'')+'</td><td><button class="btn btn-danger btn-sm" onclick="deleteContract(\''+c.id+'\')">Delete</button></td></tr>';}).join('')+
      '</tbody></table>':'<div class="empty">No contracts yet. Click <strong>New contract</strong> to create one.</div>')+
      '</div></div>';
  }).catch(function(err){
    showModuleError(area,'Contracts',err);
  });
}

function openContractModal(){
  var partners=window._contractPartners||[];
  var opts=partners.map(function(p){return '<option value="'+p.id+'">'+p.name+' ('+(p.type||p.role)+')</option>';}).join('');
  var ov=document.createElement('div');
  ov.className='overlay';
  ov.innerHTML='<div class="modal"><div class="modal-ttl">Create contract record <span class="modal-x" onclick="this.closest(\'.overlay\').remove()">✕</span></div><div id="cta"></div>'+
  '<div class="fg"><label>Partner</label><select id="ctpartner"><option value="">— Select partner —</option>'+opts+'</select></div>'+
  '<div class="g2"><div class="fg"><label>Start date</label><input id="ctstart" type="date"></div><div class="fg"><label>End date</label><input id="ctend" type="date"></div></div>'+
  '<div class="fg"><label>Document URL</label><input id="cturl" placeholder="Google Drive / PDF link"></div>'+
  '<div class="fg"><label>Notes</label><textarea id="ctnotes" rows="3" placeholder="Revenue share, territory, obligations…"></textarea></div>'+
  '<div class="row" style="justify-content:flex-end"><button class="btn btn-outline" onclick="this.closest(\'.overlay\').remove()">Cancel</button><button id="ctsave" class="btn btn-primary" onclick="saveContract()">Save contract</button></div></div>';
  document.body.appendChild(ov);
}

function saveContract(){
  var partners=window._contractPartners||[],pid=$('ctpartner').value,partner=partners.find(function(p){return p.id===pid}),box=$('cta'),btn=$('ctsave');
  if(!partner){box.innerHTML='<div class="alert alert-err">Select a partner.</div>';return}
  btn.disabled=true;btn.textContent='Saving…';
  createPartnerContract({partnerId:partner.id,partnerName:partner.name,partnerType:partner.type,startDate:$('ctstart').value,endDate:$('ctend').value,documentUrl:$('cturl').value,notes:$('ctnotes').value,status:'active'})
  .then(function(){document.querySelector('.overlay').remove();adminContracts($('main'));})
  .catch(function(err){box.innerHTML='<div class="alert alert-err">'+err.message+'</div>';btn.disabled=false;btn.textContent='Save contract';});
}

function adminCommissions(area){getEnrollments().then(function(rows){var due=rows.filter(function(e){return e.commissionStatus==='due'}),paid=rows.filter(function(e){return e.commissionStatus==='paid'});area.innerHTML='<div class="ph"><div><h1>Commissions</h1><p>Track partner commissions and payment status.</p></div></div><div class="stats"><div class="sc gold"><div class="sv">'+money(due.reduce(function(a,e){return a+Number(e.commissionAmount||0)},0))+'</div><div class="sl">Due</div></div><div class="sc green"><div class="sv">'+money(paid.reduce(function(a,e){return a+Number(e.commissionAmount||0)},0))+'</div><div class="sl">Paid</div></div></div><div class="card"><div class="card-ttl">Commissions due</div><div class="tw">'+(due.length?'<table><thead><tr><th>Partner</th><th>Student</th><th>Program</th><th>Amount</th><th>Date</th><th>Action</th></tr></thead><tbody>'+due.map(function(e){return'<tr><td>'+e.sourceName+'</td><td>'+e.studentName+'</td><td>'+progName(e.programId)+'</td><td>'+money(e.commissionAmount)+'</td><td>'+fmt(e.timestamp)+'</td><td><button class="btn btn-primary btn-sm" onclick="markCommissionPaid(\''+e.id+'\',\''+e.sourceId+'\','+Number(e.commissionAmount||0)+')">Mark paid</button></td></tr>'}).join('')+'</tbody></table>':'<div class="empty">No commissions due.</div>')+'</div></div>'})}function markCommissionPaid(eid,pid,amt){if(!confirm('Confirm commission payment?'))return;updateEnrollment(eid,{commissionStatus:'paid',commissionPaidAt:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){if(pid&&amt)return updatePartner(pid,{totalCommission:firebase.firestore.FieldValue.increment(amt)})}).then(function(){adminCommissions($('main'))})}
function adminReports(area){getEnrollments().then(function(rows){window._reportRows=rows;area.innerHTML='<div class="ph"><div><h1>Reports</h1><p>Export operational data for management review.</p></div><div class="row"><button class="btn btn-outline" onclick="exportExcel(window._reportRows,\'improtech_report\')">⬇ Excel</button><button class="btn btn-outline" onclick="exportPDF(window._reportRows,\'IMPROTECH TRAINING CENTER Enrollment Report\',\'improtech_report\')">⬇ PDF</button></div></div>'+leadTable(rows,false)})}function adminSettings(area){area.innerHTML='<div class="ph"><div><h1>Settings</h1><p>SaaS configuration recommendations.</p></div></div><div class="card"><div class="card-ttl">Recommended Firestore security</div><div class="alert alert-warn">For production, admins should read everything, but partners should only read enrollments where <code>sourceId == request.auth.uid</code>.</div><pre class="code-box">Admin: read/write all\nPartner: read own enrollments\nPublic: create enrollment only</pre></div>'}
function viewPartnerPortal(){var label=(S.profile.type==='school'?'School Partner':(S.profile.type||'Agent'));shell([{key:'dashboard',label:'Dashboard',icon:'📊'},
    {key:'analytics',label:'Analytics',icon:'📈'},{key:'link',label:'Referral Link',icon:'🔗'},{key:'students',label:'My Students',icon:'🎓'},{key:'followups',label:'Follow-ups',icon:'📅'},{key:'commissions',label:'My Commissions',icon:'💰'}],label,loadPartnerTab)}function loadPartnerTab(){var area=$('main');area.innerHTML='<div class="loader" style="min-height:50vh"><div class="spinner"></div></div>';if(S.tab==='dashboard')partnerDashboard(area);else if(S.tab==='link')partnerLink(area);else if(S.tab==='students')partnerStudents(area);else if(S.tab==='followups')partnerFollowups(area);else partnerCommissions(area)}
function partnerDashboard(area){getEnrollments(S.user.uid).then(function(rows){window._partnerLeads=rows;var paid=rows.filter(function(e){return e.leadStatus==='paid'}).length,due=rows.filter(function(e){return e.commissionStatus==='due'}).reduce(function(a,e){return a+Number(e.commissionAmount||0)},0);area.innerHTML='<div class="ph"><div><h1>Hello, '+(S.profile.name||'Partner').split(' ')[0]+' 👋</h1><p>Track your referral performance and student progress.</p></div></div><div class="stats"><div class="sc"><div class="sv">'+rows.length+'</div><div class="sl">Total leads</div></div><div class="sc green"><div class="sv">'+paid+'</div><div class="sl">Paid students</div></div><div class="sc gold"><div class="sv">'+money(due)+'</div><div class="sl">Commission due</div></div><div class="sc blue"><div class="sv">'+rows.filter(function(e){return e.nextFollowUpDate}).length+'</div><div class="sl">Follow-ups</div></div></div><div class="card"><div class="card-ttl">Your referral link</div><div class="code-box">'+referralUrl(S.profile.code)+'</div><div class="row mt16"><button class="btn btn-primary btn-sm" onclick="copyText(\''+referralUrl(S.profile.code)+'\',this)">Copy link</button><button class="btn btn-outline btn-sm" onclick="S.tab=\'link\';viewPartnerPortal()">View QR</button></div></div>'})}function partnerLink(area){var url=referralUrl(S.profile.code),qr=url+'&qr=1';area.innerHTML='<div class="ph"><div><h1>Referral Link</h1><p>Share your link or QR code.</p></div></div><div class="g2"><div class="card"><div class="card-ttl">Unique link</div><div class="code-box">'+url+'</div><div class="row mt16"><button class="btn btn-primary btn-sm" onclick="copyText(\''+url+'\',this)">Copy</button><button class="btn btn-outline btn-sm" onclick="window.open(\''+url+'\',\'_blank\')">Test</button></div><hr><p class="xs muted">QR tracking link</p><div class="code-box mt8">'+qr+'</div></div><div class="card" style="text-align:center"><div class="card-ttl">QR Code</div><div id="qr-wrap" style="display:flex;justify-content:center;margin:16px 0"></div><button class="btn btn-gold btn-sm" onclick="downloadQR()">Download QR</button></div></div>';setTimeout(function(){var w=$('qr-wrap');if(w&&typeof QRCode!=='undefined')new QRCode(w,{text:qr,width:190,height:190,colorDark:'#251560',colorLight:'#ffffff'})},100)}function partnerStudents(area){getEnrollments(S.user.uid).then(function(rows){window._partnerLeads=rows;area.innerHTML='<div class="ph"><div><h1>My Students</h1><p>'+rows.length+' student lead(s).</p></div><div class="row"><button class="btn btn-outline btn-sm" onclick="exportExcel(window._partnerLeads,\'my_students\')">⬇ Excel</button><button class="btn btn-outline btn-sm" onclick="exportPDF(window._partnerLeads,\'My Students\',\'my_students\')">⬇ PDF</button></div></div>'+leadTable(rows,false)})}function partnerFollowups(area){getEnrollments(S.user.uid).then(function(rows){rows=rows.filter(function(e){return e.nextFollowUpDate});window._partnerLeads=rows;area.innerHTML='<div class="ph"><div><h1>Follow-ups</h1><p>Students that require follow-up.</p></div></div>'+leadTable(rows,false)})}function partnerCommissions(area){getEnrollments(S.user.uid).then(function(rows){var due=rows.filter(function(e){return e.commissionStatus==='due'}),paid=rows.filter(function(e){return e.commissionStatus==='paid'});area.innerHTML='<div class="ph"><div><h1>My Commissions</h1><p>Track pending and paid commissions.</p></div></div><div class="stats"><div class="sc gold"><div class="sv">'+money(due.reduce(function(a,e){return a+Number(e.commissionAmount||0)},0))+'</div><div class="sl">Due</div></div><div class="sc green"><div class="sv">'+money(paid.reduce(function(a,e){return a+Number(e.commissionAmount||0)},0))+'</div><div class="sl">Paid</div></div></div>'+leadTable(rows,false)})}function copyText(txt,btn){navigator.clipboard.writeText(txt);if(btn){var t=btn.textContent;btn.textContent='Copied';setTimeout(function(){btn.textContent=t},1500)}}function downloadQR(){var c=document.querySelector('#qr-wrap canvas');if(c){var a=document.createElement('a');a.download='QR_'+S.profile.code+'.png';a.href=c.toDataURL();a.click()}}
function route(user){if(!user){S={user:null,profile:null,isAdmin:false,tab:'dashboard',leadFilter:{stage:'all',source:'all',program:'all',search:''}};viewLogin();return}S.user=user;db.collection('agents').doc(user.uid).get().then(function(doc){if(!doc.exists){auth.signOut();return}S.profile=normalizeProfile(Object.assign({id:doc.id},doc.data()));S.isAdmin=S.profile.role==='admin';S.tab='dashboard';if(S.isAdmin)viewAdmin();else viewPartnerPortal()}).catch(function(err){viewLogin('Error: '+err.message)})}
var initRef=new URLSearchParams(location.search).get('ref');if(initRef){viewEnroll(initRef)}else{var t=setTimeout(function(){viewLogin('Timeout. Check that Firebase Auth and Firestore are enabled.')},9000);auth.onAuthStateChanged(function(user){clearTimeout(t);route(user)})}
window.addEventListener('error', function(e){
  console.error('Global JavaScript error:', e.error || e.message);
  var main=document.getElementById('main');
  if(main && main.innerHTML.indexOf('spinner') !== -1){
    main.innerHTML='<div class="card"><div class="alert alert-err"><strong>JavaScript error:</strong> '+(e.message||'Unknown error')+'</div></div>';
  }
});
window.addEventListener('unhandledrejection', function(e){
  console.error('Unhandled promise rejection:', e.reason);
  var main=document.getElementById('main');
  if(main && main.innerHTML.indexOf('spinner') !== -1){
    var msg=(e.reason && e.reason.message) ? e.reason.message : e.reason;
    main.innerHTML='<div class="card"><div class="alert alert-err"><strong>Request error:</strong> '+msg+'</div></div>';
  }
});
</script>
